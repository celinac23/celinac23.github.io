---
layout: default
---
<article class="wrap wrap-narrow page post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    {% assign words = content | number_of_words %}
    <span>· {{ words | divided_by: 200 | plus: 1 }} min read</span>
  </p>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.description %}<p class="page-subtitle">{{ page.description }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
